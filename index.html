<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Khóa Học CCNA Chuyên Nghiệp</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Nút mạng xã hội -->
    <div class="social-nav">
        <a href="https://www.tiktok.com/@thebaovn?_r=1&_t=ZS-9689XmmeO0q" target="_blank" class="btn-social tiktok">TIKTOK</a>
        <a href="https://zaloapp.com/qr/p/xzkrobe1cdfg?src=qr" target="_blank" class="btn-social zalo">ZALO</a>
    </div>

    <!-- QR Code Ủng hộ -->
    <div class="qr-donate">
        <img src="nganhang.png" alt="QR Ngân Hàng" class="qr-img">
        <p>Ủng hộ chủ TUS 👉👈[cite: 1]</p>
    </div>

    <div class="container">
        <!-- Trang chủ: Dashboard 6 chủ đề mở đầu -->
        <header class="main-header">
            <h1>Khám Phá Kỷ Nguyên Quản Trị Mạng Mới[cite: 1]</h1>
            <p>6 Bước Ngoặt Tái Định Nghĩa Ngành Mạng[cite: 1]</p>
        </header>

        <div class="dashboard-grid" id="intro-dashboard">
            <!-- Render via JS -->
        </div>

        <!-- Pop-up (Modal) cho các chủ đề Intro -->
        <div id="intro-modal" class="modal">
            <div class="modal-content">
                <span class="close-btn">&times;</span>
                <h2 id="modal-title"></h2>
                <div id="modal-body"></div>
            </div>
        </div>

        <!-- Giao diện Khóa Học (Trang con 1 & Trang con 2) -->
        <section class="course-section">
            <h2 class="section-title">Danh Sách Bài Học CCNA[cite: 1]</h2>
            <div class="course-layout">
                <!-- Trang con 1: Sidebar chứa chủ đề và bài học -->
                <aside class="course-sidebar" id="course-accordion">
                    <!-- Render via JS -->
                </aside>

                <!-- Trang con 2: Khu vực hiển thị nội dung bài học -->
                <main class="course-content-area" id="lesson-view">
                    <div class="placeholder-text">Vui lòng chọn một bài học ở danh sách bên trái để bắt đầu.[cite: 1]</div>
                </main>
            </div>
        </section>
    </div>

    <script src="script.js"></script>
</body>
</html>
